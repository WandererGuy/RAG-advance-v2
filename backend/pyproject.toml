[project]
name = "rag-chatbot-backend"
version = "0.1.0"
description = "Q&A over internal company documents, with citations"
requires-python = ">=3.12"

# Only what Phases 1-2 actually use. Anything for a later phase gets added when that
# phase arrives, not now.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    # Phase 2: embedding provider wrapper, loaders, token counting
    "litellm>=1.59",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "tiktoken>=0.8",
    "tqdm>=4.67",
    # Phase 4: prompt templates. LiteLLM already pulls Jinja2 in, but the prompts are ours and
    # a transitive dependency is not a contract.
    "jinja2>=3.1",
    # Phase 5: POST /documents is a multipart upload, and FastAPI refuses to build the route
    # without this at import time.
    "python-multipart>=0.0.20",
    # Phase 6: the Jina rerank adapter calls the HTTP API directly, because LiteLLM 1.96 does
    # not route Jina reranking. LiteLLM pulls httpx in anyway, but it is listed here for the
    # same reason jinja2 is: a transitive dependency is not a contract.
    "httpx>=0.28",
]

[project.optional-dependencies]
# Phase 5: the demo UI. Separate from the runtime deps because the API must be deployable
# without it — the frontend is a client, not part of the service.
frontend = [
    "streamlit>=1.41",
    "requests>=2.32",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
# Third-party stubs are patchy; our own code is what we care about typing.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
